name: pulse
on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/pulse.py
      - name: commit
        run: |
          git config user.name "beacon-pulse"
          git config user.email "gazetheeupon@users.noreply.github.com"
          git add beacons.json
          if git diff --cached --quiet; then
            echo "no beacon changes"
          else
            git commit -m "pulse: update beacons.json"
            git push
          fi
